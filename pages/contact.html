<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact and Location</title>
  <link rel="stylesheet" href="../dist/output.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #f1f5f9;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .font-serif {
      font-family: 'Playfair Display', Georgia, Cambria, 'Times New Roman', Times, serif;
    }
  </style>
</head>
<body class="text-slate-800 font-sans antialiased min-h-screen flex flex-col p-0 m-0 w-full overflow-x-hidden">

  <!-- Top Global Navigation Bar -->
  <header class="sticky top-0 z-50 w-full bg-[#083B36]/95 backdrop-blur-md border-b border-[#D4AF37]/30 shadow-lg px-6 sm:px-12 lg:px-20 pt-4 pb-3.5 flex flex-wrap justify-between items-center gap-4 transition duration-300">
    <a href="home.html" class="flex items-center gap-2.5 font-serif font-bold text-2xl text-[#D4AF37] tracking-wide">
      <span class="w-9 h-9 rounded-xl bg-[#D4AF37] text-[#083B36] flex items-center justify-center text-base shadow-md">
        <i class="fa-solid fa-heart-pulse"></i>
      </span>
      <span>Clinic<span class="text-white">Care</span></span>
    </a>
    <nav class="flex flex-wrap items-center gap-3 sm:gap-8 text-sm sm:text-base font-serif font-medium">
      <a href="home.html" class="text-white hover:text-[#D4AF37] active:text-[#D4AF37] focus:text-[#D4AF37] transition">Home</a>
      <a href="treatment.html" class="text-white hover:text-[#D4AF37] active:text-[#D4AF37] focus:text-[#D4AF37] transition">Treatments</a>
      <a href="about-clinic.html" class="text-white hover:text-[#D4AF37] active:text-[#D4AF37] focus:text-[#D4AF37] transition">About Clinic</a>
      <a href="meet-doctor.html" class="text-white hover:text-[#D4AF37] active:text-[#D4AF37] focus:text-[#D4AF37] transition">Meet Doctor</a>
      <a href="contact.html" class="text-[#D4AF37] border-b-2 border-[#D4AF37] pb-0.5 font-bold transition">Contact</a>
      <a href="booking.html" class="bg-[#D4AF37] hover:bg-amber-400 text-[#083B36] font-bold px-4 py-2 rounded-xl transition text-xs sm:text-sm font-serif shadow-md">Booking</a>
    </nav>
  </header>

  <!-- Page Main Content exactly matching Contact.png mockup -->
  <main class="max-w-4xl mx-auto w-full space-y-6 px-4 sm:px-6 py-8 flex-grow">
    
    <!-- Title Pill Badge & Label -->
    <div class="flex items-center gap-4">
      <span class="bg-[#dbeafe] text-[#1e40af] px-6 py-2 rounded-full font-bold text-lg inline-block shadow-xs">
        Contact and Location
      </span>
      <span class="text-slate-400 text-sm hidden sm:inline">&mdash;&mdash; Half-height map</span>
    </div>

    <!-- MAIN CARD CONTAINER -->
    <div class="bg-white rounded-3xl border border-slate-200/90 shadow-xl overflow-hidden p-6 sm:p-8 space-y-8">
      
      <!-- Top Grid: Form Left + Map Right -->
      <div class="grid md:grid-cols-12 gap-8 items-start">
        
        <!-- Left: Contact form -->
        <div class="md:col-span-6 space-y-4">
          <h2 class="text-2xl font-serif font-bold text-slate-900">Contact form</h2>
          
          <form class="space-y-3.5" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Name</label>
              <input type="text" placeholder="Name" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm placeholder:text-slate-400">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
                <input type="email" placeholder="Email" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm placeholder:text-slate-400">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Phone</label>
                <input type="text" placeholder="Reason" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm placeholder:text-slate-400">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Reason</label>
              <textarea rows="3" placeholder="Message" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm placeholder:text-slate-400"></textarea>
            </div>

            <div>
              <button type="submit" class="bg-[#083B36] hover:bg-[#0c4e48] text-[#D4AF37] font-serif font-bold px-8 py-2.5 rounded-xl shadow-sm transition text-sm">
                Contact
              </button>
            </div>
          </form>
        </div>

        <!-- Right: Map, Address, Hours & Actions -->
        <div class="md:col-span-6 space-y-4">
          
          <!-- Styled Vector Map Container with Red Pin -->
          <div class="w-full h-44 rounded-2xl border border-slate-200 overflow-hidden relative shadow-inner bg-[#e5eef7] flex items-center justify-center">
            <svg class="absolute inset-0 w-full h-full opacity-60" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
                </pattern>
              </defs>
              <rect width="100%" height="100%" fill="#f1f5f9" />
              <rect width="100%" height="100%" fill="url(#grid)" />
              <line x1="0" y1="20" x2="400" y2="180" stroke="#ffffff" stroke-width="8" />
              <line x1="100" y1="0" x2="320" y2="200" stroke="#ffffff" stroke-width="6" />
              <line x1="0" y1="120" x2="350" y2="40" stroke="#ffffff" stroke-width="7" />
              <path d="M 20 120 Q 50 100 60 140 Z" fill="#dcfce7" />
              <path d="M 280 20 Q 320 30 310 70 Z" fill="#dcfce7" />
            </svg>
            
            <div class="relative z-10 flex flex-col items-center">
              <div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center animate-ping absolute"></div>
              <div class="w-10 h-10 rounded-full bg-red-500/30 flex items-center justify-center relative">
                <i class="fa-solid fa-location-dot text-2xl text-red-600 drop-shadow-md"></i>
              </div>
            </div>
          </div>

          <!-- Location & Hours Details -->
          <div class="space-y-2 text-xs font-semibold text-slate-800">
            <div class="flex items-center gap-2.5">
              <span class="w-7 h-7 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-location-dot"></i>
              </span>
              <span>3125 Dase south Street, Maasam, WI 34245</span>
            </div>

            <div class="flex items-center gap-2.5">
              <span class="w-7 h-7 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-clock"></i>
              </span>
              <span>Hours: am - 1:00 pm</span>
            </div>
          </div>

          <!-- Buttons: WhatsApp & Give Feedback -->
          <div class="grid grid-cols-2 gap-3 pt-2">
            <a href="https://wa.me/" target="_blank" class="bg-[#22c55e] hover:bg-[#16a34a] text-white font-bold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 text-xs shadow transition">
              <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp
            </a>
            <button onclick="alert('Thank you for your feedback!')" class="bg-[#083B36] hover:bg-[#0c4e48] text-[#D4AF37] font-serif font-bold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 text-xs shadow transition">
              <i class="fa-regular fa-comment-dots text-sm"></i> Give Feedback
            </button>
          </div>

        </div>

      </div>

      <!-- Bottom Video Players Row -->
      <div class="grid sm:grid-cols-2 gap-6 pt-4 border-t border-slate-100">
        
        <!-- Video Player 1 -->
        <div class="bg-[#cbd5e1] rounded-2xl h-44 flex flex-col justify-between p-3.5 shadow-inner relative group">
          <div></div>
          
          <div class="flex items-center justify-center">
            <button class="w-12 h-12 rounded-full bg-slate-700/90 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition">
              <i class="fa-solid fa-play ml-0.5 text-sm"></i>
            </button>
          </div>

          <div class="bg-slate-800/90 backdrop-blur-sm rounded-xl px-3 py-1.5 flex items-center gap-3 text-white text-xs">
            <button><i class="fa-solid fa-play text-[10px]"></i></button>
            <div class="flex-1 h-1 bg-slate-600 rounded-full overflow-hidden">
              <div class="w-2/5 h-full bg-[#D4AF37] rounded-full"></div>
            </div>
            <button><i class="fa-solid fa-volume-high text-[10px]"></i></button>
            <button><i class="fa-solid fa-expand text-[10px]"></i></button>
          </div>
        </div>

        <!-- Video Player 2 -->
        <div class="bg-[#cbd5e1] rounded-2xl h-44 flex flex-col justify-between p-3.5 shadow-inner relative group">
          <div></div>
          
          <div class="flex items-center justify-center">
            <button class="w-12 h-12 rounded-full bg-slate-700/90 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition">
              <i class="fa-solid fa-play ml-0.5 text-sm"></i>
            </button>
          </div>

          <div class="bg-slate-800/90 backdrop-blur-sm rounded-xl px-3 py-1.5 flex items-center gap-3 text-white text-xs">
            <button><i class="fa-solid fa-play text-[10px]"></i></button>
            <div class="flex-1 h-1 bg-slate-600 rounded-full overflow-hidden">
              <div class="w-1/3 h-full bg-[#D4AF37] rounded-full"></div>
            </div>
            <button><i class="fa-solid fa-volume-high text-[10px]"></i></button>
            <button><i class="fa-solid fa-expand text-[10px]"></i></button>
          </div>
        </div>

      </div>

    </div>

  </main>

  <footer class="w-full text-center text-xs text-slate-400 py-6 border-t border-slate-200/60 font-serif">
    &copy; 2026 Clinic Care. All rights reserved.
  </footer>

</body>
</html>
